name: Build and upload conda package
description: Build and upload conda package using the mslice-deploy pixi environment. Requires pixi to be set up first.

inputs:
  repository:
    description: 'Anaconda repository'
    required: true
    default: 'mantid'
  label:
    description: 'Label'
    required: false
    default: 'nightly'
  token:
    description: 'Anaconda API Token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Build package
      shell: bash
      run: |
        VERSION=$(pixi run -e mslice-deploy python -m versioningit)
        echo "Building MSlice version ${VERSION}"
        pixi run -e mslice-deploy rattler-build build \
          --recipe conda/recipe.yaml \
          -c conda-forge \
          -c mantid/label/nightly \
          -c mantid \
          --variant "version=${VERSION}" \
          --output-dir output

    - name: Upload package to Anaconda.org
      shell: bash
      env:
        ANACONDA_API_KEY: ${{ inputs.token }}
      run: |
        pixi run -e mslice-deploy rattler-build upload anaconda \
          --owner ${{ inputs.repository }} \
          --channel ${{ inputs.label }} \
          output/**/*.conda
