name: MSlice nightly build (Pixi)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  test:
    if: github.repository_owner == 'mantidproject'
    runs-on: 	ubuntu-latest

    steps:
      - name: Checkout MSlice
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true
          environments: mslice-env

      - name: Install Mantid
        run: |
          mamba install -c mantid/label/nightly mantid mantidqt

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Run tests
        run: pixi run -e mslice-env test

      - name: Report Coverage and send to Coveralls
        env:
          COVERALLS_REPO_TOKEN : ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          pixi run -e mslice-env coverage
