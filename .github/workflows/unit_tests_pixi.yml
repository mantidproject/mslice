name: MSlice unit tests (Pixi)

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}-pixi
  cancel-in-progress: true

jobs:
  test:
    if: github.repository_owner == 'mantidproject'
    runs-on: 	ubuntu-latest

    steps:
      - name: Checkout MSlice
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true
          environments: mslice-ci

      - name: Run tests
        run: pixi run -e mslice-ci test

      - name: Report coverage
        run: pixi run -e mslice-ci coverage
