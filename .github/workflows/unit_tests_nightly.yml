name: MSlice nightly build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    if: github.repository_owner == 'mantidproject'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MSlice
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: ./.github/actions/setup-pixi

      # Ignore the lock file and resolve the environment again, so that the tests run against the latest
      # nightly mantid and mantidqt packages. Updating only mantid and mantidqt can keep an older nightly,
      # as the other locked dependencies can be too old for the latest nightly.
      - name: Update environment to the latest Mantid nightly
        run: pixi update -e mslice-ci

      - name: Show Mantid version
        run: pixi list -e mslice-ci mantid

      - name: Run tests
        run: pixi run -e mslice-ci test

      - name: Report coverage and send to Coveralls
        env:
          COVERALLS_REPO_TOKEN : ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          pixi run -e mslice-ci coveralls
          pixi run -e mslice-ci coverage
