[workspace]
name = "mslice"
channels = [
    "conda-forge",
    "mantid",
    "mantid/label/nightly",
]
platforms = ["linux-64", "win-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
coverage = "*"
mock = "*"
pytest = "*"
qtconsole-base = "*"

[feature.mslice.dependencies]
pyqt = "*"
qtpy = "*"
ipython = "*"
coveralls = "*"

[feature.mantid.dependencies]
mantid = "*"
mantidqt = "*"

[feature.developer.dependencies]
pre-commit = "*"

[feature.test]
platforms = ["linux-64"]

[feature.test.tasks]
test = """
QT_QPA_PLATFORM=offscreen \
coverage run -m pytest
"""
coverage = """
coveralls
coverage report
"""

[environments]
mslice-env = ["mslice"] # Equivalent to environment.yml
mslice-ci = ["mslice", "mantid", "test"] # Only created for linux as the unit tests run only on ubuntu runners
mslice-developer = ["mantid", "developer"] # Equivalent to mslice-developer.yml