[workspace]
name = "mslice"
channels = [
    "conda-forge",
    "mantid",
    "mantid/label/nightly",
]
platforms = [
    "linux-64",
    "win-64",
    { platform = "osx-arm64", macos = "14.0" },
]
channel-priority = "flexible"

[dependencies]
python = "3.13.*"
coverage = "*"
mock = "*"
pytest = "*"
qtconsole-base = "*"

[feature.mslice.dependencies]
pyqt6 = ">=6.11,<7"
qtpy = "*"
ipython = "*"
coveralls = "*"

[feature.mantid.dependencies]
# Use the nightly builds, so that MSlice is tested against the latest Mantid
mantid = { version = "*", channel = "mantid/label/nightly" }
mantidqt = { version = "*", channel = "mantid/label/nightly" }

[feature.developer.dependencies]
pre-commit = "*"

[feature.test]
platforms = ["linux-64"]

[feature.test.tasks]
test = """
QT_QPA_PLATFORM=offscreen \
coverage run -m pytest
"""
coverage = "coverage report"
coveralls = "coveralls"

[feature.deploy]
platforms = ["linux-64"]

[feature.deploy.dependencies]
python = "3.13.*"
rattler-build = "*"
anaconda-client = "*"
versioningit = "*"

[environments]
mslice-env = ["mslice"] # Runtime environment for MSlice without Mantid
mslice-ci = ["mslice", "mantid", "test"] # Only created for linux as the unit tests run only on ubuntu runners
mslice-developer = ["mantid", "developer"] # Equivalent to mslice-developer.yml
mslice-deploy = { features = ["deploy"], no-default-feature = true } # Builds and uploads the conda package, linux only
