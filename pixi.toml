[workspace]
name = "mslice"
channels = [
    "conda-forge",
    "mantid",
    "mantid/label/nightly",
]
platforms = ["linux-64", "win-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
coverage = "*"
mock = "*"
pytest = "*"
qtconsole-base = "*"

[feature.mslice.dependencies]
pyqt = "*"
qtpy = "*"
ipython = "*"
coveralls = "*"

[feature.mantid.dependencies]
mantid = "*"
mantidqt = "*"

[feature.developer.dependencies]
pre-commit = "*"

[feature.test.tasks]
test = """
xvfb-run --server-args='-screen 0 640x480x24' --auto-servernum \
coverage run -m pytest
"""
coverage = """
coveralls
coverage report
"""

[environments]
mslice-env = ["mslice"] # Equivalent to environment.yml
mslice-env-test = ["mslice", "mantid", "test"]
mantidnightly = ["mantid", "developer"] # Equivalent to mslice-developer.yml